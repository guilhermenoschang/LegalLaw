[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["public/legal/*.json"]

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/legal-source"
  to = "/.netlify/functions/legal-source"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
